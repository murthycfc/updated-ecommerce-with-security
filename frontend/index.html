<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand" href="#">
                E-Commerce Store
            </a>
            <div>
                <span class="btn btn-outline-light btn-sm" id="cartLink" style="cursor: pointer;">
                    Cart: <span id="cartCount">0</span>
                </span>
                <button class="btn btn-outline-light btn-sm m-2" id="wishlistbtn">
                    Wishlist: <span id="wishlistCount">0</span>
                </button>
                <button class="btn btn-outline-light btn-sm" id="userOrders">Orders</button>
                <button
                    class="btn btn-outline-light btn-sm ms-3"
                    id="logoutBtn">
                Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="text-center mb-4">
            Our Products
        </h2>

        <div class="row mb-4">
            <div class="col-md-5 mx-auto">
                <input
                    type="text"
                    id="searchInput" 
                    class="form-control"
                    placeholder="Search products..."
                >
            </div>
            <div class="col-md-4">
                <select id="categoryFilter" class="form-select">
                    <option value="All">All categories</option>
                    <option>Electronics</option>
                    <option>Clothing</option>
                    <option>Furniture</option>
                    <option>Sports</option>
                    <option>Accessories</option>
                    <option>Books</option>
                    <option>Footwear</option>
                    <option>Beauty</option>
                    <option>Jewellery</option>
                    <option>Footwear</option>
                    <option>Home & Kitchen</option>
                    
                </select>
            </div>

            <div class="col-md-3">
                <select id="sortFilter" class="form-select">
                    <option value="">None</option>
                    <option value="asc">Price: Low to High</option>
                    <option value="desc">Price: High to Low</option>
                </select>
            </div>

        </div>

        <div id="productContainer" class="row g-4">

        </div>

        <div id="paginationContainer" class="d-flex justify-content-center mt-4">

        </div>
    </div>


    <!--my Orders Modal -->
    <div class="modal fade" id="viewOrderModal" tabindex="-1"
     aria-labelledby="myOrdersModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="viewOrderModalLabel">My Orders</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table class="table table-bordered table-striped">
                            <thead class="table-dark">
                                <tr>
                                    <th>Order ID</th>
                                    <th>Subtotal</th>
                                    <th>Discount</th>
                                    <th>Final Total</th>
                                    <th>Order Date</th>
                                    <th>Delivery Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="myOrdersTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>


    <!--  Order Items Modal -->
    <div class="modal fade" id="orderItemsModal" tabindex="-1"
        aria-labelledby="orderItemsModalLabel" aria-hidden="true">

        <div class="modal-dialog modal-xl">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="userOrdersModalLabel">
                        Order Items
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>
                </div>

                <div class="modal-body">

                    <h6 class="mb-3">
                        <strong>Order ID:</strong>
                        <span id="selectedOrderId"></span>
                    </h6>

                    <div class="table-responsive">

                        <table class="table table-bordered table-hover table-striped">
                            <thead class="table-dark">
                                <tr>
                                    <th>Product Name</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Quantity</th>
                                    <th>Total</th>
                                </tr>
                            </thead>

                            <tbody id="orderItemsTableBody">
                            </tbody>
                        </table>

                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
