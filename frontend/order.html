<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - E-Commerce</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                My E-Commerce
            </a>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn" > Logout </button>
        </div>
    </nav>

    <main class=" container my-5">
        <div id="orderPage">
            <h2 class="text-center mb-4">
                Order Summary
            </h2>
            <section class="mb-5">
                <h4 class="mb-3">
                    Your Cart
                </h4>
                <div id="orderCartContainer">

                </div>
            </section>

            <section class="col-12 mb-3">
                <h4 class="mb-3">
                    Coupons
                </h4>
                <div id="couponContainer">

                </div>
            </section>

            <section class="mb-5">
                <div class="card">
                    <div class="card-body">
                        <h4 class="mb-4">Bill Summary</h4>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Subtotal</span>
                            <span id="orderSubtotal">₹0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>
                                Discount
                                
                            </span>
                            <span id="orderDiscountAmount">₹0</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between">
                            <h5>Final Total</h5>
                            <h5 class="text-success" id="orderFinalTotal">₹0</h5>
                        </div>
                    </div>
                </div>
            </section>

            <section>
                <div class="card">
                    <div class="card-body">
                        <h4 class="mb-4">Checkout Details</h4>
                        <form id="checkoutForm"  novalidate>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="customerName" class="form-label">Name</label>
                                    <input type="text" class="form-control" 
                                        id="customerName" placeholder="Enter your name" required    
                                    >
                                    <div class="invalid-feedback">Please enter your name.</div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="customerPhone" class="form-label">Phone Number</label>
                                    <input type="tel" class="form-control" 
                                        id="customerPhone" placeholder="Enter 10-digit phone number"
                                        pattern="[0-9]{10}" maxlength="10" required    
                                    >
                                    <div class="invalid-feedback">Please enter a valid 10-digit phone number.</div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="customerEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" 
                                    id="customerEmail" placeholder="Enter your email" readonly required    
                                >
                                <div class="invalid-feedback">Please enter a valid email.</div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="customerAddress" class="form-label">Address</label>
                                <textarea class="form-control" id="customerAddress" 
                                    rows="3" placeholder="Enter your complete delivery address" required    
                                ></textarea>
                                <div class="invalid-feedback">Please enter your complete address.</div>
                            </div>
                            <!-- <div class="mb-3">
                                <label for="customerPincode" class="form-label">Pincode</label>
                                <input type="text" class="form-control" 
                                    id="customerPincode" placeholder="Enter 6-digit pincode" 
                                    pattern="[0-9]{6}" maxlength="6" required    
                                >
                                <div class="invalid-feedback">Please enter a valid 6-digit pincode.</div>
                            </div> -->
                            <div class="text-center">
                                <button type="submit" class="btn btn-success px-5">Confirm Order</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="js/order.js"></script>

</body>
</html>
