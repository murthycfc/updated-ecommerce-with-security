<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart page</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand" href="http://localhost/index.html">
                E-Commerce Store
            </a>
            <button class="btn btn-outline-light btn-sm ms-3" id="logoutBtn">
                Logout
            </button>
        </div>
    </nav>
    <div class="container my-5">
        <h2 class="text-center mb-4">
            Shopping Cart
        </h2>
        <div id="emptyCart" class="alert alert-info text-center d-none">
            Your cart is empty.
        </div>

        <div id="cartContainer">
            <div id="cartItems">
                
            </div>
            <div id="cartSummary">
                <div class="card mt-4">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <span>Subtotal</span>
                            <span id="subtotal">
                                ₹0
                            </span>
                        </div>
                        
                        <hr>
                        <div class="d-flex justify-content-between">
                            <h5>Final Total</h5>
                            <h5 class="text-success" id="finalTotal">
                                ₹0
                            </h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-center m-4">
            <button class="btn btn-primary" id="orderProceed">Proceed to Order</button>
        </div>
    </div>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="js/cart.js"></script>
</body>
</html>
