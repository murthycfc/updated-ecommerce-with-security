<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - E-Commerce</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">Create Account</h2>
                        <form id="registerForm" novalidate>
                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" id="name"
                                    class="form-control" required>
                                <div id="nameError" class="text-danger small mt-1"></div>
                            </div>
                            <div class="mb-3">

                                <label for="email" class="form-label">Email</label>
                                <input type="email" id="email"
                                    class="form-control" required>
                                <div id="emailError" class="text-danger small mt-1"></div>
                            </div>
                            <div class="mb-3">

                                <label for="phoneNumber" class="form-label">Phone Number</label>
                                <input type="text" id="phoneNumber"
                                    class="form-control" required>
                                <div id="phoneNumberError" class="text-danger small mt-1"></div>
                            </div>
                            <div class="mb-3">

                                <label for="password" class="form-label">Password</label>
                                <div class="d-flex">
                                    <input type="password" id="password" class="form-control" required>
                                    <button type="button" class="btn" id="togglePassword">
                                        <i class="bi bi-eye" id="eyeIcon"></i>
                                    </button>
                                </div>
                                <div id="passwordError" class="text-danger small mt-1"></div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Register
                            </button>
                        </form>
                        <div
                            id="message"
                            class="mt-3 text-center">
                        </div>

                        <p class="text-center mt-3">
                            Already have an account?
                            <a href="login.html">Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="js/register.js"></script>
</body>
</html>
